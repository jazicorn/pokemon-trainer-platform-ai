[tool.commitizen]
name = "cz_customize"
# Baseline matches pyproject.toml's [project] version — this repo predates
# the release pipeline, so the first `cz bump` in CI tags this as v0.1.0
# rather than starting over at v0.0.x.
version = "0.3.3"
version_files = ["pyproject.toml:version"]
tag_format = "v$version"
version_scheme = "semver2"
major_version_zero = true
# Auto-generates/updates CHANGELOG.md from Conventional Commits on every bump.
# The pre-pipeline project history now lives in HISTORY.md instead, so there's
# no more format clash between hand-written and auto-generated content.
update_changelog_on_bump = true
# Matches this repo's own commit schema below and the (release) scope
# reserved for CI automation in .githooks/commit-msg.
bump_message = "chore(release): bump version $current_version → $new_version"
use_editor = true

[tool.commitizen.customize]
# Conventional-commits style message output
message_template = '{{change_type}}{% if scope %}({{scope}}){% endif %}{% if breaking %}!{% endif %}: {{message}}'
example = 'chore(make): add inspect tooling'
schema = '<type>(<scope>): <subject>'
# Use TOML literal string to avoid backslash escaping issues.
schema_pattern = '(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([\w\-.]+\))?(!)?:\s.+'

# Without these three, cz_customize falls back to BaseCommitizen's defaults
# (match-everything, no type grouping) — which also match each paragraph of
# a commit *body*, shredding multi-paragraph commit messages into unrelated
# top-level bullets. commit_parser's alternation covers every type in
# schema_pattern above (not just bump-worthy ones — that's bump_map's job
# below, a separate concern from what's *shown* here), so every real commit
# still gets a changelog entry, just grouped and no longer shredded.
commit_parser = '^((?P<change_type>feat|fix|docs|style|refactor|perf|test|build|ci|chore|BREAKING CHANGE)(?:\((?P<scope>[^()\r\n]*)\)|\()?(?P<breaking>!)?|\w+!):\s(?P<message>.*)?'
changelog_pattern = '^((BREAKING[\-\ ]CHANGE|\w+)(\(.+\))?!?):'
change_type_map = { feat = "✨ Features", fix = "🐛 Fixes", refactor = "♻️ Refactoring", perf = "⚡ Performance", docs = "📝 Documentation", style = "💄 Style", test = "✅ Tests", build = "📦 Build", ci = "👷 CI", chore = "🔧 Chores" }

# Version bump rules (Phase 0 safe: only feat/fix/perf bump)
bump_map = { feat = "MINOR", fix = "PATCH", perf = "PATCH" }

# --- Interactive questions (this controls the cz commit menu) --------------

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change you are committing"
choices = [
  { value = "fix",      name = "fix: A bug fix. Correlates with PATCH in SemVer" },
  { value = "feat",     name = "feat: A new feature. Correlates with MINOR in SemVer" },
  { value = "docs",     name = "docs: Documentation only changes" },
  { value = "style",    name = "style: Changes that do not affect the meaning of the code (white-space, formatting, missing semi-colons, etc)" },
  { value = "refactor", name = "refactor: A code change that neither fixes a bug nor adds a feature" },
  { value = "perf",     name = "perf: A code change that improves performance" },
  { value = "test",     name = "test: Adding missing or correcting existing tests" },
  { value = "build",    name = "build: Changes that affect the build system or external dependencies (example scopes: pip, docker, npm)" },
  { value = "ci",       name = "ci: Changes to CI configuration files and scripts (example scopes: GitLabCI)" },
  { value = "chore",    name = "chore: Maintenance tasks (tooling, repo hygiene, CI ergonomics)" }
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "Scope (optional, press enter to skip)"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "breaking"
message = "Is this a BREAKING CHANGE?"
default = false

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Write a short, imperative description of the change"

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Longer description (optional, press enter to skip)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "footer"
message = "Footer (optional, e.g. BREAKING CHANGE: ..., closes #123)"
