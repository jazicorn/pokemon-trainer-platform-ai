name: CI Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-quality-${{ github.ref }}
  # Off by default. Opt in via a repo variable: Settings > Secrets and
  # variables > Actions > Variables > CANCEL_CI_ON_PUSH = true.
  cancel-in-progress: ${{ vars.CANCEL_CI_ON_PUSH == 'true' }}

jobs:
  quality:
    name: ruff + pyright (no Docker/ChromaDB needed)
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for the commit-message check below

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint, format, and type check
        run: make lint

      - name: Dependency vulnerability scan (pip-audit)
        # Report-only: findings show in the log but don't fail the build.
        # pip-audit doesn't report severity, so a hard block per-finding
        # isn't workable yet — Dependabot's PRs (.github/dependabot.yml) are
        # expected to work the current findings down over time.
        run: uv run pip-audit
        continue-on-error: true

      - name: Validate commit messages (Commitizen)
        if: github.event_name == 'pull_request'
        run: uv run cz check --rev-range origin/${{ github.base_ref }}..HEAD
