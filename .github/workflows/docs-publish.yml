name: Docs Publish

# Builds the docs site (ROADMAP.md Phase 10 — Astro + Starlight, web/docs-site/)
# and pushes it to the gh-pages branch on every push to main that touches the
# docs corpus or the site's own config. GitHub Pages itself (Settings > Pages,
# serving from gh-pages) is a one-time manual step this workflow can't do.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "web/docs-site/**"
      - "scripts/docs_prepare.py"
      - "README.md"
      - "ROADMAP.md"
      - "ROADMAP_PLATFORM.md"
      - "ARCHITECTURE.md"
      - "HISTORY.md"
      - "CHANGELOG.md"
      - "Makefile"
  workflow_dispatch:

permissions:
  contents: write # peaceiris/actions-gh-pages pushes to the gh-pages branch

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish docs site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        # Only for scripts/docs_prepare.py, which is plain-stdlib Python —
        # nothing in this job needs a project dependency group.
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/docs-site/package-lock.json

      - name: Build docs site
        # docs-prepare mirrors this repo's markdown into
        # web/docs-site/src/content/docs/ (see scripts/docs_prepare.py — Astro
        # can't reach outside its own project any more than MkDocs could).
        run: make docs-build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/docs-site/dist
          force_orphan: true
