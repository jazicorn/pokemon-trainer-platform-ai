name: CI Image Build

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app.py"
      - "src/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-build-${{ github.ref }}
  # Off by default. Opt in via a repo variable: Settings > Secrets and
  # variables > Actions > Variables > CANCEL_CI_ON_PUSH = true.
  cancel-in-progress: ${{ vars.CANCEL_CI_ON_PUSH == 'true' }}

jobs:
  build:
    name: Docker build (no push)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (CI only, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64
          tags: pokemon-trainer-platform-ai:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
