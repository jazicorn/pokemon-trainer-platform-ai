name: CI Failure Helper Comment

on:
  workflow_run:
    workflows:
      - CI Test
      - CI Quality
      - CI Image Build
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

jobs:
  comment-on-failure:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Comment (or update comment) on PR with repro steps
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];

            if (!prs.length) {
              core.info("CI failed but no associated pull request was found.");
              return;
            }

            const marker = "<!-- ci-failure-helper-comment -->";
            const repoUrl = "https://github.com/" + context.repo.owner + "/" + context.repo.repo;

            const checks = {
              "CI Quality": {
                repro: "make lint       # ruff format --check, ruff check, pyright\nmake lint-fix    # auto-fix what can be auto-fixed",
                docName: "PYRIGHT.md",
                docPath: "docs/REFERENCE/PYRIGHT.md",
              },
              "CI Image Build": {
                repro: "make docker-build   # docker compose build app",
                docName: "docker-compose.yml",
                docPath: "docker-compose.yml",
              },
              "CI Test": {
                repro: 'uv run pytest tests/ -v --tb=short -m "not requires_chromadb and not requires_chroma_cloud"',
                docName: "TESTING.md",
                docPath: "docs/REFERENCE/TESTING.md",
              },
            };
            const check = checks[run.name] || checks["CI Test"];

            const body =
              marker + "\n" +
              "### ❌ " + run.name + " failed for this PR\n\n" +
              "Reproduce locally:\n\n" +
              "```bash\n" + check.repro + "\n```\n\n" +
              "See [" + check.docName + "](" + repoUrl + "/blob/main/" + check.docPath + ") for troubleshooting, " +
              "or [runtime-errors.md](" + repoUrl + "/blob/main/docs/TROUBLESHOOTING/runtime-errors.md) " +
              "for environment issues.\n\n" +
              "**Run:** " + run.html_url + "\n" +
              "**Commit:** `" + run.head_sha + "`\n";

            for (const pr of prs) {
              const issue_number = pr.number;

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  per_page: 100
                }
              );

              const existing = comments.find((c) => (c.body || "").includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: body
                });
                core.info("Updated CI helper comment on PR #" + issue_number);
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue_number,
                  body: body
                });
                core.info("Created CI helper comment on PR #" + issue_number);
              }
            }
