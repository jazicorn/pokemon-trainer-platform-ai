name: Release

# Runs on every push to main and self-determines whether a release is
# warranted, via `cz bump` reading Conventional Commits history (see
# cz.toml's bump_map). No feat/fix/perf commits since the last tag -> no-op.
#
# Uses a GitHub App token (not the default GITHUB_TOKEN) to push the version
# commit and tag. This matters: GITHUB_TOKEN-authored pushes are deliberately
# blocked from triggering other workflows, so image-publish.yml's
# `on: push: tags: - "v*"` would silently never fire without it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: cz bump (version + tag)
    runs-on: ubuntu-latest
    # The App token above (deliberately) lets this workflow's own pushes
    # trigger other workflows — but `push: branches: [main]` then also
    # retriggers *this* workflow on its own bump commit. Without this guard,
    # pushing "chore(release): bump ... 0.2.0 → 0.2.1" immediately kicks off
    # a second run that tries to bump again on top of it (0.2.1 → 0.3.0),
    # racing the first run's own tag push. Skip runs whose own push is one
    # of these bump commits.
    if: |
      github.repository == 'jazicorn/pokemon-trainer-platform-ai' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')

    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # `app-id` is deprecated in favor of `client-id` (a different value —
          # the App's Client ID, not its numeric App ID). APP_ID is still used
          # below for the bot's noreply commit email, which requires the
          # numeric ID specifically.
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout (full history — cz needs it to see commits since the last tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Wait for CI checks on this commit
        # ci-test.yml, ci-quality.yml, and image-build.yml all trigger on
        # this exact same push — but this job runs `cz bump` and pushes a
        # new commit with no dependency on those slower checks finishing
        # first. That push lands on the same `main` ref, so their
        # `cancel-in-progress` concurrency groups treat it like any other
        # new push and cancel the still-running checks for the commit a
        # human actually just pushed, replacing them with checks for the
        # bot's own bump commit instead — the real commit's CI results never
        # get to finish. Block here until those three are done for this
        # exact SHA before doing anything else, so that doesn't happen.
        # Skipped on workflow_dispatch: a manual run has no push-triggered
        # checks to correlate against, and could hang forever waiting for
        # runs that will never appear.
        #
        # Must run AFTER checkout: it needs an actual git repo to diff paths
        # and for `gh` to auto-detect owner/repo — running it as the very
        # first step (before any checkout exists) fails outright with
        # "not a git repository".
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait_for=("CI Test" "CI Quality")
          # image-build.yml only triggers when these paths change (mirrors
          # its own `on.push.paths` list — keep the two in sync). Without
          # this check, a commit that doesn't touch any of them (like a
          # workflow-only or docs-only change) means "CI Image Build" never
          # runs at all, and waiting for it unconditionally would spin for
          # the full timeout below and fail the release outright.
          if git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" | \
             grep -qE '^(Dockerfile|\.dockerignore|app\.py|src/|pyproject\.toml|uv\.lock)'; then
            wait_for+=("CI Image Build")
          fi
          echo "Waiting for: ${wait_for[*]:-<none>} on $GITHUB_SHA"
          for _ in $(seq 1 60); do  # ~15 min ceiling
            all_done=true
            for name in "${wait_for[@]}"; do
              status=$(gh run list --repo "${{ github.repository }}" \
                --branch "${{ github.ref_name }}" --workflow "$name" \
                --json headSha,status --jq \
                "[.[] | select(.headSha == \"$GITHUB_SHA\")] | .[0].status // \"pending\"")
              if [ "$status" != "completed" ]; then
                echo "  $name: $status"
                all_done=false
              fi
            done
            if $all_done; then
              echo "All CI checks completed for $GITHUB_SHA."
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for CI checks on $GITHUB_SHA." >&2
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Configure git identity as the release bot
        run: |
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email \
            "${{ secrets.APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Bump version and tag (no-op if nothing warrants a release)
        id: cz
        run: |
          set +e
          uv run cz bump --yes
          status=$?
          set -e
          case $status in
            0)
              echo "released=true" >> "$GITHUB_OUTPUT"
              # Capture the tag name now, the instant it's created. It must
              # NOT be recomputed later via `git describe` — the next step
              # amends this commit, which orphans this exact tag object (it
              # still points at the pre-amend SHA, no longer an ancestor of
              # HEAD), so `git describe --tags --abbrev=0` after the amend
              # silently falls back to the previous release's tag instead.
              # That bug is what force-moved v0.2.0 onto the 0.2.1 commit
              # and left the real v0.2.1 tag orphaned and never pushed.
              echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"
              ;;
            3|21)
              # 3  = NoCommitsFoundError (no commits since the last tag)
              # 21 = NoneIncrementExit (commits exist, but none warrant a bump)
              echo "No commits warrant a release. Skipping."
              echo "released=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              exit $status
              ;;
          esac

      - name: Sync uv.lock with the bumped version
        # `cz bump` only rewrites pyproject.toml's `version` (per
        # version_files in cz.toml) — it never touches uv.lock, which also
        # records the project's own version. Left alone, every subsequent
        # `uv sync --locked` (including this same push's own CI run) fails
        # with "lockfile needs to be updated". Fold the regenerated lockfile
        # into the same release commit and move the tag to match, so the
        # release stays a single clean commit+tag instead of gaining a
        # trailing "update lockfile" commit.
        if: steps.cz.outputs.released == 'true'
        run: |
          uv lock
          if ! git diff --quiet -- uv.lock; then
            git add uv.lock
            git commit --amend --no-edit
            git tag -f "${{ steps.cz.outputs.tag }}" HEAD
          fi

      - name: Push version commit and tag
        # NOT `git push --follow-tags`: cz.toml doesn't set `annotated_tag`,
        # so `cz bump` creates a lightweight tag — and `--follow-tags` only
        # pushes *annotated* tags. It silently no-ops on a lightweight one
        # (exit 0, no tag on the remote), which is exactly what happened to
        # v0.2.0: the bump commit landed on main but the tag never did, so
        # image-publish.yml (triggered by `push: tags: v*`) never fired.
        # Push the branch and the tag explicitly by name instead.
        if: steps.cz.outputs.released == 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin "${{ steps.cz.outputs.tag }}"

      - name: Create GitHub Release
        # A pushed tag is just a git ref — GitHub Releases are a separate
        # object (its own page, notes, source archives) that nothing here
        # creates on its own. image-publish.yml's GHCR packages exist without
        # a matching Release for the same reason: it triggers off the tag
        # push, not off a Release.
        #
        # Ship the actual CHANGELOG.md section for this version as the
        # release notes, not `--generate-notes` — this repo pushes straight
        # to main with no PRs, so GitHub's own auto-notes have nothing to
        # categorize and produce just a bare compare link. CHANGELOG.md was
        # already regenerated by `cz bump` earlier in this same job, so
        # extract the block from this tag's own "## v$version (...)"
        # heading up to (not including) the next "## " heading.
        if: steps.cz.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tag="${{ steps.cz.outputs.tag }}"
          awk -v search="## ${tag} (" '
            index($0, search) == 1 { print; found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md

          if [ -s /tmp/release-notes.md ]; then
            gh release create "$tag" --title "$tag" --notes-file /tmp/release-notes.md
          else
            echo "No matching CHANGELOG.md section for $tag — falling back to generated notes." >&2
            gh release create "$tag" --title "$tag" --generate-notes
          fi
