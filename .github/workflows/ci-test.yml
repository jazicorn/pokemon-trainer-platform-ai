name: CI Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-test-${{ github.ref }}
  # Off by default. Opt in via a repo variable: Settings > Secrets and
  # variables > Actions > Variables > CANCEL_CI_ON_PUSH = true.
  cancel-in-progress: ${{ vars.CANCEL_CI_ON_PUSH == 'true' }}

jobs:
  test:
    name: pytest (mocked LLM, no live keys/ChromaDB needed)
    runs-on: ubuntu-latest

    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short -m "not requires_chromadb and not requires_chroma_cloud"
