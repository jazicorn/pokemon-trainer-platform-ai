[project]
name = "pokemon-trainer-platform-ai"
version = "0.1.0"
description = "Pokemon Trainer Platform - AI: multi-agent trade advisor"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typer",
  "python-dotenv>=1.0.1",
  "pydantic-ai",
  "pyyaml",
  "rich",
  "pydantic-evals>=1.0.1",
  "questionary>=2.1.1",
  "httpx>=0.28.1",
  "mcp[cli]>=1.19.0",
  "logfire[httpx]>=4.14.2",
  "pydantic-ai-slim[web]>=1.7.0",
  "anthropic>=0.77.1",
  "requests>=2.32.5",
  "chromadb-client>=1.5.0",
  "opentelemetry-api>=1.39.1",
  "opentelemetry-sdk>=1.39.1",
  "opentelemetry-exporter-otlp>=1.39.1",
  "openinference-instrumentation-pydantic-ai>=0.1.12",
]

[project.scripts]
chromadb = "chromadb_setup.chromadb_quickstart:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chromadb_setup"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.1",
]
platform-db = [
    "psycopg[binary]>=3.2",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = '.venv'
extraPaths = ["src"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (likely bugs / design smells)
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade (modern syntax)
    "PLE", # pylint errors
]

[tool.ruff.lint.per-file-ignores]
# HEADER in this file is a hand-aligned Rich console banner — its rows are
# padded to line up visually and can't be wrapped without breaking the layout.
"src/cli/app.py" = ["E501"]

