[project]
name = "pokemon-trainer-platform-ai"
version = "0.1.0"
description = "AI agent for Pokemon Trainer Platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "typer",
  "pydantic-ai",
  "pyyaml",
  "rich",
  "pydantic-evals>=1.0.1",
  "questionary>=2.1.1",
  "httpx>=0.28.1",
  "mcp[cli]>=1.19.0",
  "logfire[httpx]>=4.14.2",
  "pydantic-ai-slim[web]>=1.7.0",
  "anthropic>=0.77.1",
  "requests>=2.32.5",
  "chromadb-client>=1.5.0",
  "opentelemetry-api>=1.39.1",
  "opentelemetry-sdk>=1.39.1",
  "opentelemetry-exporter-otlp>=1.39.1",
  "openinference-instrumentation-pydantic-ai>=0.1.12",
]

[project.scripts]
chromadb = "chromadb_setup.chromadb_quickstart:main"

[dependency-groups]
dev = [
    "pyright>=1.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.1",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = '.venv'
extraPaths = ["src"]
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false

