[pytest]
# If you need stdin for interactive ChromaDB prompts, pass -s explicitly:
#   pytest tests/test_rag.py -s
asyncio_mode = strict
markers =
    requires_chromadb: marks tests that need a live ChromaDB instance (deselect with -m "not requires_chromadb")
    requires_chroma_cloud: marks tests that need a live Chroma Cloud account/API key (deselect with -m "not requires_chroma_cloud")
