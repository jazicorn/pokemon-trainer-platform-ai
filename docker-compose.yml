# Local dev stack for the Pokemon Trainer's Second Brain.
#
# Replaces the ad hoc `docker run` commands in chromadb_setup/chromadb-docker.sh
# and `make phoenix-start` with one composed stack. Those Makefile targets and
# scripts still work standalone for host-based (non-Docker) runs of the CLI —
# this file is for running the whole thing, app included, inside Docker.
#
# Usage:
#   docker compose run --rm app              # CLI + ChromaDB only (default)
#   docker compose --profile observability run --rm app   # + Phoenix tracing
#   docker compose --profile platform-db run --rm app     # + local PostgreSQL
#   docker compose up api                    # Web API instead of the CLI (ROADMAP.md Phase 9)
#
# `run` (not `up`) is used for the app service because the CLI is an
# interactive REPL, not a long-running server — `run --rm` attaches a TTY
# and cleans up the container on exit. ChromaDB/Phoenix/Postgres are ordinary
# long-running services and come up automatically as dependencies. `api` is
# also long-running, so it uses `up` the same way.
#
# This file is for local dev/testing parity, not the production deploy path
# for the API — see docs/DEPLOYMENT.md (Fly.io, fly.toml) for that. Running
# `docker compose up api` here is how to exercise the exact same command and
# healthcheck Fly runs, without needing a real deploy to test it.
#
# API keys and model selection come from a root .env file (see .env.example) —
# docker compose reads it automatically for the ${VAR} substitutions below.

services:
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - ./chromadb_setup/chroma_data:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "false"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
    profiles: [observability]
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PLATFORM_DB_USER:-trainer}
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:-secret}
      POSTGRES_DB: ${PLATFORM_DB_NAME:-pokemon_platform}
    volumes:
      - platform_db_data:/var/lib/postgresql/data
    profiles: [platform-db]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      chromadb:
        condition: service_healthy
    environment:
      # Model selection and API keys — from the root .env file.
      POKEMON_MODEL: ${POKEMON_MODEL:-claude-sonnet}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      # Override host-oriented defaults with compose's internal DNS names —
      # these are NOT the same as the localhost URLs in .env.example.
      CHROMADB_URL: http://chromadb:8000
      PHOENIX_URL: http://phoenix:6006
      # Only takes effect with --profile platform-db; otherwise unset, so
      # the app falls back to local mock data exactly as it does on a host run.
      PLATFORM_DB_URL: ${PLATFORM_DB_URL:-}
    volumes:
      - ./data:/app/data
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python api_server.py
    depends_on:
      chromadb:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Phase 3 — required for any tenant operation; there is no sane default.
      TENANT_DB_ENCRYPTION_KEY: ${TENANT_DB_ENCRYPTION_KEY:?TENANT_DB_ENCRYPTION_KEY must be set to run the api service}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ENABLE_PHOENIX: ${ENABLE_PHOENIX:-}
      # Unset locally is fine — falls back to an in-memory rate-limit counter.
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-}
      CHROMADB_URL: http://chromadb:8000
      PHOENIX_URL: http://phoenix:6006
    volumes:
      # data/tenants.db (Phase 3) lives here — losing this volume means every
      # provisioned tenant loses access. Same mount the app service uses.
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  platform_db_data:
