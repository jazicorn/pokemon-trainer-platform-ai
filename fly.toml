# Fly.io app config for the public API (ROADMAP.md Phase 14). See
# docs/DEPLOYMENT.md for the full runbook, including the Chroma Cloud
# secrets this app needs (RAG's vector storage — no second Fly app for it).
#
# Built from this repo's own Dockerfile via `fly deploy` — not the GHCR
# image image-publish.yml already publishes. Wiring CI to deploy that image
# automatically on release is a natural fast-follow, not done here.

app = "REPLACE-WITH-YOUR-APP-NAME"
primary_region = "REPLACE-WITH-YOUR-REGION"  # e.g. "iad" — see `fly platform regions`

[build]

[env]
  API_HOST = "0.0.0.0"
  API_PORT = "8080"

# The Dockerfile's own CMD launches the CLI (app.py), not the API server —
# it's the same image used for both. Without this, Fly falls back to that
# CMD as-is (process group commands supersede a Docker image's CMD, but only
# when a [processes] section actually defines one), so the deployed Machine
# would run the CLI instead of api_server.py. "app" is Fly's own implicit
# default group name; naming it explicitly here is what lets us override it.
[processes]
  app = "uv run python api_server.py"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "10s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[mounts]]
  source = "data_volume"
  destination = "/app/data"
